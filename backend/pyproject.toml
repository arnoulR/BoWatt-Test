[project]
name = "bowatt-backend"
version = "0.1.0"
description = "Document ingestion backend for the BoWatt research agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20.0",
    "docling>=2.28.0",
    "fastapi>=0.115.0",
    "langchain-openai>=0.3.9",
    "parallel-web>=1.3,<2",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "qdrant-client[fastembed]>=1.19,<1.20",
    "tiktoken>=0.9.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.11.0",
]

[tool.pytest.ini_options]
markers = ["integration: requires a running local Qdrant server"]
pythonpath = ["."]
testpaths = ["tests", "integration_tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
