services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    restart: on-failure
    depends_on:
      - qdrant
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in backend/.env}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:?Set PARALLEL_API_KEY in backend/.env}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5.6-luna}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-shared_documents}
      DATA_DIR: /app/data
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-10}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RESEARCH_MAX_FETCHED_URLS: ${RESEARCH_MAX_FETCHED_URLS:-8}
      RESEARCH_MAX_CONCURRENT_CALLS: ${RESEARCH_MAX_CONCURRENT_CALLS:-3}
      RESEARCH_MAX_RETRIES: ${RESEARCH_MAX_RETRIES:-2}
      RESEARCH_PROVIDER_TIMEOUT_SECONDS: ${RESEARCH_PROVIDER_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data

volumes:
  qdrant_data:
